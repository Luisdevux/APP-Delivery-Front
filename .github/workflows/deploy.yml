name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE: eduardotartas/app-pedidos-front:${{ github.sha }}
  KUBERNETES_NAMESPACE: rango-prod # Namespace onde a aplicação vai rodar

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Kubeconform lint
        uses: docker://ghcr.io/yannh/kubeconform:latest-alpine
        with:
          args: -summary -verbose -strict deploy/

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.DOCKER_IMAGE }},eduardotartas/app-pedidos-front:latest

  deploy:
    runs-on: self-hosted # Runner local na VPS configurado
    needs: build
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Update deployment image
        run: |
          kubectl set image deployment/app-pedidos-front app-pedidos-front=${{ env.DOCKER_IMAGE }} -n ${{ env.KUBERNETES_NAMESPACE }}
          kubectl rollout status deployment/app-pedidos-front -n ${{ env.KUBERNETES_NAMESPACE }}
